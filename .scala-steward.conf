# Scala Steward configuration, see
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

updates.pin = [
  # Artifact names carry the Spark major version (spark4), so stay on Spark 4.x
  { groupId = "org.apache.spark", version = "4." },
  # Stay on Scala 2.13; Spark 4 does not publish Scala 3 artifacts
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.13." },
  # Must stay compatible with the Avro and Parquet versions Spark ships
  { groupId = "org.apache.avro", version = "1.12." },
  { groupId = "org.apache.parquet", version = "1.17." }
]

updates.ignore = [
  # Moving to scalatest 3.1+ means renaming FunSuite to AnyFunSuite across all suites
  { groupId = "org.scalatest" }
]

pullRequests.grouping = [
  { name = "spark", title = "Update Spark", filter = [{ group = "org.apache.spark" }] },
  { name = "patches", title = "Patch updates", filter = [{ version = "patch" }] }
]

commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"

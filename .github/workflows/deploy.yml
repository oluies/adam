name: Deploy Snapshot

on:
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'bigdatagenomics/adam' }}
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v9
      - env:
          MILL_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./mill --ticker false mill.javalib.SonatypeCentralPublishModule/

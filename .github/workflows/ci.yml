name: CI

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    env:
        SPARK_LOCAL_IP: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v9
      # Mill fetches the JVM pinned by mill-jvm-version in build.mill
      - run: ./mill --ticker false __.compile
      # tests run against scoverage-instrumented classes
      - run: ./mill --ticker false __.test
      - run: ./mill --ticker false scoverage.xmlReportAll
      # CRAP scores for Scala methods (report only, no gate yet)
      - run: ./mill --ticker false scripts/crap.scala --top 40
      - run: ./mill --ticker false adam-assembly.assembly
